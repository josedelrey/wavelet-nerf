[project]
name = "wavelet-nerf"
version = "0.1.0"
description = "PyTorch experiments with NeRF, SIREN, and wavelet multiplicative filter networks."
readme = "README.md"
authors = [{ name = "José del Rey" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "imageio>=2.34",
    "tensorboard>=2.16",
    "tqdm>=4.66",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = ["ruff>=0.16.7"]
cpu = ["torch>=2.4"]
cu130 = ["torch>=2.4"]

[project.urls]
Repository = "https://github.com/josedelrey/wavelet-nerf"
Issues = "https://github.com/josedelrey/wavelet-nerf/issues"

[tool.uv]
package = false
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
