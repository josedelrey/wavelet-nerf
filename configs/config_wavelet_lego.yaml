log_root: "./logs"
experiment_name: "wavelet_lego"  # Scene-specific log and checkpoint subfolder

dataset_path: "./datasets/lego"
dataset_type: "blender"  # OpenGL camera poses; world-space geometry rays
dataset_factor: 1  # Full resolution; splits come from their JSON files
white_background: true
scene_center: [0.0, 0.0, 0.0]  # World-space center of the scene cube
scene_scale: 2.0  # Cube half-extent; model coordinates = (xyz - center) / scale

num_random_rays: 1024
chunk_size: 1024
num_samples: 128

num_iters: 300000
learning_rate: 0.0005
near: 2.0
far: 6.0

save_path: "./models"
save_interval: 5000

lr_decay: 300.0  # Number of 1000-step intervals for decay
lr_decay_factor: 0.1
lr_min: 5e-05

log_interval: 100
val_interval: 50000

first_step_render: false

num_render_poses: 80  # Number of frames of the evaluation video
render_orbit_elevation: -30.0  # Degrees; orbit is centered at the source-world origin
render_orbit_radius: 4.0  # World-space camera distance
num_samples_eval: 256

model_type: "wavelet"

wave_in_features: 3
wave_hidden_dim: 256
wave_num_layers: 8
wave_dir_encoding_dim: 4
input_scale: 128.0
weight_scale: 1.0
alpha: 6.0
beta: 1.0
omega0: 5.0
normalized: true
