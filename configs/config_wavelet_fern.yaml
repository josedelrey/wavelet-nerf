# Forward-facing LLFF Fern scene. Sampling bounds are in NDC
dataset_type: "llff"
dataset_path: "./datasets/fern"
dataset_factor: 8
llff_holdout: 8
llff_bounds_scale: 0.75
llff_recenter: true
white_background: false
scene_center: [0.0, 0.0, 0.0]
scene_scale: 1.0
near: 0.0
far: 1.0

log_root: "./logs"
save_path: "./models"
num_random_rays: 1024
chunk_size: 1024
save_interval: 5000
log_interval: 100
val_interval: 10000
first_step_render: false
num_render_poses: 120
render_spiral_rotations: 2.0  # Turns around the recentered average camera
render_spiral_zrate: 0.5  # Vertical oscillation rate per turn
render_spiral_radius_scale: 1.0  # Multiplier on camera-position percentile radii

# Experimental starting settings. No claim of reproduced Fern scores
model_type: "wavelet"
experiment_name: "wavelet_fern"
num_iters: 300000
learning_rate: 0.0005
lr_decay: 300.0
lr_decay_factor: 0.1
lr_min: 5e-05
num_samples: 128
num_samples_eval: 256
wave_in_features: 3
wave_hidden_dim: 256
wave_num_layers: 8
wave_dir_encoding_dim: 4
input_scale: 128.0
weight_scale: 1.0
alpha: 6.0
beta: 1.0
omega0: 5.0
normalized: true
